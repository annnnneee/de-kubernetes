apiVersion: v1
kind: Service
metadata:
  name: rustfs-headless
  namespace: de-kubernetes
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: rustfs
  ports:
    - port: 9000
      name: s3
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: de-kubernetes
spec:
  type: NodePort
  selector:
    app: rustfs
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30090
      name: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: de-kubernetes
spec:
  serviceName: rustfs-headless
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: rustfs
          image: de-rustfs:hw5
          imagePullPolicy: Never
          env:
            - name: RUSTFS_VOLUMES
              value: "http://rustfs-{0...3}.rustfs-headless.de-kubernetes.svc.cluster.local:9000/data"
            - name: RUSTFS_ERASURE_SET_DRIVE_COUNT
              value: "4"
            - name: RUSTFS_STORAGE_CLASS_STANDARD
              value: "EC:2"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: /logs
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: secret-key
          ports:
            - containerPort: 9000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
      volumes:
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
