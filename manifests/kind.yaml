kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: de-kubernetes
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: __SOURCE_CSV__
        containerPath: /dataset/vacancies.csv
        readOnly: true
    extraPortMappings:
      - containerPort: 30090
        hostPort: 19100
        listenAddress: "127.0.0.1"
        protocol: TCP
